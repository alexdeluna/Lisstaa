<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2875e8"
    >

    <title>Lista de Compras</title>

    <link
        rel="stylesheet"
        href="visual.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <!-- ================================================= -->
    <!-- CABEÇALHO -->
    <!-- ================================================= -->

    <header>

        <h1>
            Lista de Compras
        </h1>

        <p>
            V1.1
        </p>

    </header>


    <main>


        <!-- ================================================= -->
        <!-- TELA PRINCIPAL -->
        <!-- ================================================= -->

        <section
            id="telaPrincipal"
            class="tela"
        >

            <div class="cartao">

                <h2>
                    Menu Principal
                </h2>

                <p>
                    Crie uma nova lista de compras.
                </p>

                <button
                    id="botaoCriarLista"
                    class="botao botao-principal"
                >
                    Criar nova lista
                </button>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- TELA CRIAR LISTA -->
        <!-- ================================================= -->

        <section
            id="telaCriarLista"
            class="tela escondido"
        >

            <div class="cartao">

                <h2>
                    Criar Lista
                </h2>


                <!-- FORMULÁRIO -->

                <div class="campo">

                    <label for="nomeItem">
                        Nome do item
                    </label>

                    <input
                        type="text"
                        id="nomeItem"
                        placeholder="Ex.: Arroz"
                        autocomplete="off"
                    >

                </div>


                <div class="campo">

                    <label for="quantidadeItem">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidadeItem"
                        min="1"
                        step="1"
                        placeholder="Ex.: 2"
                        inputmode="numeric"
                    >

                </div>


                <button
                    id="botaoAdicionarItem"
                    class="botao botao-principal"
                >
                    Adicionar item
                </button>

            </div>


            <!-- ================================================= -->
            <!-- ITENS DA LISTA -->
            <!-- ================================================= -->

            <div class="cartao">

                <div class="titulo-lista">

                    <h2>
                        Minha Lista
                    </h2>

                    <span id="contadorItens">
                        0 itens
                    </span>

                </div>


                <div id="listaItens">

                    <p class="lista-vazia">
                        Nenhum item adicionado.
                    </p>

                </div>


                <button
                    id="botaoFinalizarLista"
                    class="botao botao-sucesso"
                >
                    Finalizar lista
                </button>


                <button
                    id="botaoVoltarPrincipal"
                    class="botao botao-secundario"
                >
                    Menu principal
                </button>

            </div>

        </section>


        <!-- ================================================= -->
        <!-- TELA COMPRAR ITENS -->
        <!-- ================================================= -->

        <section
            id="telaComprar"
            class="tela escondido"
        >

            <div class="cartao">

                <h2>
                    Comprar Itens
                </h2>

                <p>
                    Informe o valor de cada item e marque
                    quando ele for comprado.
                </p>

            </div>


            <div id="listaCompra">

                <!-- Os itens serão inseridos pelo app.js -->

            </div>


            <!-- ================================================= -->
            <!-- TOTAL -->
            <!-- ================================================= -->

            <div class="cartao">

                <div class="total">

                    <span>
                        Total da compra
                    </span>

                    <strong id="totalCompra">
                        R$ 0,00
                    </strong>

                </div>


                <button
                    id="botaoVoltarLista"
                    class="botao botao-secundario"
                >
                    Voltar para lista
                </button>

            </div>

        </section>


    </main>


    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="app.js"></script>


</body>

</html>
