<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#2875e8"
    >

    <title>Lista de Compras</title>

    <link
        rel="stylesheet"
        href="visual.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header>

        <h1>
            Lista de Compras
        </h1>

        <p>
            V1.1
        </p>

    </header>


    <main>


        <!-- =====================================================
             TELA PRINCIPAL
             ===================================================== -->

        <section
            id="telaPrincipal"
            class="tela"
        >

            <div class="cartao">

                <h2>
                    Menu Principal
                </h2>

                <button
                    id="botaoCriarLista"
                    class="botao botao-principal"
                >
                    Criar nova lista
                </button>


                <button
                    id="botaoMinhasListas"
                    class="botao botao-secundario"
                >
                    Minhas listas
                </button>

            </div>

        </section>


        <!-- =====================================================
             TELA CRIAR LISTA
             ===================================================== -->

        <section
            id="telaCriarLista"
            class="tela escondido"
        >


            <!-- NOME DA LISTA -->

            <div class="cartao">

                <h2>
                    Nova Lista
                </h2>

                <div class="campo">

                    <label for="nomeLista">
                        Nome da lista
                    </label>

                    <input
                        type="text"
                        id="nomeLista"
                        placeholder="Ex.: Lista semanal"
                        autocomplete="off"
                    >

                </div>

            </div>


            <!-- CADASTRO DO ITEM -->

            <div class="cartao">

                <h2>
                    Adicionar item
                </h2>


                <div class="campo">

                    <label for="nomeItem">
                        Nome do item
                    </label>

                    <input
                        type="text"
                        id="nomeItem"
                        placeholder="Ex.: Arroz"
                        autocomplete="off"
                    >

                </div>


                <div class="campo">

                    <label for="quantidadeItem">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="quantidadeItem"
                        min="1"
                        step="1"
                        placeholder="Ex.: 2"
                        inputmode="numeric"
                    >

                </div>


                <button
                    id="botaoAdicionarItem"
                    class="botao botao-principal"
                >
                    Adicionar item
                </button>

            </div>


            <!-- ITENS DA LISTA -->

            <div class="cartao">

                <div class="titulo-lista">

                    <h2>
                        Minha Lista
                    </h2>

                    <span id="contadorItens">
                        0 itens
                    </span>

                </div>


                <div id="listaItens">

                    <p class="lista-vazia">
                        Nenhum item adicionado.
                    </p>

                </div>


                <button
                    id="botaoFinalizarLista"
                    class="botao botao-sucesso"
                >
                    Salvar lista
                </button>


                <button
                    id="botaoCancelarLista"
                    class="botao botao-secundario"
                >
                    Cancelar
                </button>

            </div>

        </section>


        <!-- =====================================================
             TELA MINHAS LISTAS
             ===================================================== -->

        <section
            id="telaMinhasListas"
            class="tela escondido"
        >

            <div class="cartao">

                <h2>
                    Minhas Listas
                </h2>

                <p>
                    Aqui ficam as listas que você preparou
                    anteriormente.
                </p>

            </div>


            <div id="listasSalvas">

                <p class="lista-vazia">
                    Nenhuma lista salva.
                </p>

            </div>


            <div class="cartao">

                <button
                    id="botaoVoltarPrincipalListas"
                    class="botao botao-secundario"
                >
                    Menu principal
                </button>

            </div>

        </section>


        <!-- =====================================================
             TELA VISUALIZAR LISTA
             ===================================================== -->

        <section
            id="telaVisualizarLista"
            class="tela escondido"
        >

            <div class="cartao">

                <h2 id="tituloListaVisualizacao">
                    Lista
                </h2>

                <p id="informacoesListaVisualizacao">
                </p>

            </div>


            <div
                id="itensListaVisualizacao"
            >

            </div>


            <div class="cartao">

                <button
                    id="botaoUsarListaVisualizacao"
                    class="botao botao-principal"
                >
                    Usar esta lista novamente
                </button>


                <button
                    id="botaoVoltarMinhasListas"
                    class="botao botao-secundario"
                >
                    Minhas listas
                </button>

            </div>

        </section>


        <!-- =====================================================
             TELA COMPRAR
             ===================================================== -->

        <section
            id="telaComprar"
            class="tela escondido"
        >

            <div class="cartao">

                <h2 id="tituloListaCompra">
                    Comprar Itens
                </h2>

                <p id="informacoesListaCompra">
                </p>

            </div>


            <div id="listaCompra">

            </div>


            <!-- TOTAL -->

            <div class="cartao">

                <div class="total">

                    <span>
                        Total da compra
                    </span>

                    <strong id="totalCompra">
                        R$ 0,00
                    </strong>

                </div>


                <button
                    id="botaoFinalizarCompra"
                    class="botao botao-sucesso"
                >
                    Finalizar compra
                </button>


                <button
                    id="botaoVoltarLista"
                    class="botao botao-secundario"
                >
                    Voltar para lista
                </button>

            </div>

        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="app.js"></script>


</body>

</html>
